<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Bricolage"; src: url("../../app/src/fonts/bricolage-grotesque.woff2") format("woff2"); font-weight: 200 800; }
  @font-face { font-family: "Instrument"; src: url("../../app/src/fonts/instrument-sans.woff2") format("woff2"); font-weight: 400 700; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1440px; height: 1000px; overflow: hidden; }
  body { font-family: "Instrument", sans-serif; color: #fff; padding: 46px 70px;
    background-color: #0b5d73;
    background-image:
      radial-gradient(820px 480px at 94% -14%, rgba(251, 191, 36, .2), transparent 60%),
      radial-gradient(760px 560px at -6% 112%, rgba(34, 211, 238, .35), transparent 60%),
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(135deg, #0e7490, #083344);
    background-size: auto, auto, 24px 24px, 24px 24px, auto; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
  h1 { font-family: "Bricolage"; font-size: 44px; letter-spacing: -.025em; margin: 0; font-weight: 800; }
  h1 em { font-style: normal; color: #fbbf24; }
  .head p { margin: 8px 0 0; font-size: 18px; color: rgba(255,255,255,.86); }
  .chips { display: flex; gap: 8px; }
  .chips span { font-size: 14px; font-weight: 600; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); padding: 5px 12px; border-radius: 999px; }
  .pages { display: flex; justify-content: center; gap: 46px; }
  .page { width: 560px; height: 760px; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 30px 60px -18px rgba(0,0,0,.55); position: relative; padding: 34px 34px 0; }
  .page .in { width: 492px; height: 726px; overflow: hidden; }
  .page img { width: 492px; display: block; }
  .page .p2 { margin-top: var(--y); }
  .page .num { position: absolute; bottom: 12px; right: 18px; font-size: 11px; color: #94a3b8; }
</style></head>
<body>
  <div class="head">
    <div>
      <h1>A clean <em>PDF</em> for the client's records</h1>
      <p>"Download PDF" opens the browser's print dialog with a print layout: no menus, no buttons, page breaks between sections.</p>
    </div>
    <div class="chips"><span>A4 / Letter</span><span>White-label</span></div>
  </div>
  <div class="pages">
    <div class="page"><div class="in"><img src="../raw/p2-public-report-print.png"></div></div>
    <div class="page"><div class="in"><img class="p2" style="--y: -2335px" src="../raw/p2-public-report-print.png"></div></div>
  </div>
</body></html>
